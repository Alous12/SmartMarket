# LOGO DE LA APP: configuración para poner el logo de SmartMarket como icono
# de la aplicación. Si cambias el logo, reemplaza las imágenes de assets/icon/
# y ejecuta: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
